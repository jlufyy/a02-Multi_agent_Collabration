[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tripflow-api"
version = "1.0.0"
description = "TripFlow ephemeral travel workflow backend"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.117.1,<1", "pydantic>=2.11.9,<3", "httpx>=0.27,<1", "uvicorn[standard]>=0.30,<1", "python-dotenv>=1,<2", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
